<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening Showroom concept</title>
<style>body{font:16px/1.6 system-ui,Arial,sans-serif;background:#141719;color:#f6f6f3;min-height:100vh;display:grid;place-items:center;margin:0;padding:25px}main{max-width:430px;text-align:center}a{color:#aeeedb}p{color:#d0d4d2}</style>
</head><body><main><h1>Opening the new concept</h1><p>Each Showroom design now has its own visual identity and independent website.</p><a id="fallback" href="demos/morrow.html">Open website preview</a></main>
<script>
(function(){
  'use strict';
  const routes={atelier:'demos/morrow.html',residence:'demos/casa.html',business:'demos/northline.html',portfolio:'demos/isla.html'};
  const space=new URLSearchParams(location.search).get('space');
  const path=Object.prototype.hasOwnProperty.call(routes,space)?routes[space]:routes.atelier;
  document.getElementById('fallback').href=path;
  location.replace(path);
})();
</script>
</body></html>
